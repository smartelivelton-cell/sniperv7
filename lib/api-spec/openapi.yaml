openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: TradeSniper AI PRO API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: anthropic
    description: Anthropic AI chat operations
  - name: trades
    description: Trade history and PNL
  - name: analysis
    description: Chart image analysis
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /anthropic/conversations:
    get:
      operationId: listAnthropicConversations
      tags: [anthropic]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnthropicConversation"
    post:
      operationId: createAnthropicConversation
      tags: [anthropic]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAnthropicConversationBody"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicConversation"
  /anthropic/conversations/{id}:
    get:
      operationId: getAnthropicConversation
      tags: [anthropic]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicError"
    delete:
      operationId: deleteAnthropicConversation
      tags: [anthropic]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicError"
  /anthropic/conversations/{id}/messages:
    get:
      operationId: listAnthropicMessages
      tags: [anthropic]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnthropicMessage"
    post:
      operationId: sendAnthropicMessage
      tags: [anthropic]
      summary: Send a message and receive an AI response (SSE stream)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendAnthropicMessageBody"
      responses:
        "200":
          description: SSE stream of assistant response chunks
          content:
            text/event-stream: {}
  /trades:
    get:
      operationId: listTrades
      tags: [trades]
      summary: List trade history
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: List of trades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trade"
    post:
      operationId: createTrade
      tags: [trades]
      summary: Record a trade result
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTradeBody"
      responses:
        "201":
          description: Created trade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"
  /trades/daily-pnl:
    get:
      operationId: getDailyPnl
      tags: [trades]
      summary: Get daily PNL summary
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Daily PNL summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyPnl"
  /analysis/analyze-charts:
    post:
      operationId: analyzeCharts
      tags: [analysis]
      summary: Analyze chart screenshots with AI vision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeChartsBody"
      responses:
        "200":
          description: Chart analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AnthropicConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt
    AnthropicMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt
    CreateAnthropicConversationBody:
      type: object
      properties:
        title:
          type: string
      required:
        - title
    SendAnthropicMessageBody:
      type: object
      properties:
        content:
          type: string
      required:
        - content
    AnthropicConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AnthropicMessage"
      required:
        - id
        - title
        - createdAt
        - messages
    AnthropicError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    Trade:
      type: object
      properties:
        id:
          type: integer
        symbol:
          type: string
        direction:
          type: string
        entryPrice:
          type: number
        exitPrice:
          type: number
        size:
          type: number
        leverage:
          type: number
        pnl:
          type: number
        result:
          type: string
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - symbol
        - direction
        - entryPrice
        - size
        - leverage
        - pnl
        - result
        - createdAt
    CreateTradeBody:
      type: object
      properties:
        symbol:
          type: string
        direction:
          type: string
        entryPrice:
          type: number
        exitPrice:
          type: number
        size:
          type: number
        leverage:
          type: number
        pnl:
          type: number
        result:
          type: string
        notes:
          type: string
      required:
        - symbol
        - direction
        - entryPrice
        - size
        - leverage
        - pnl
        - result
    DailyPnl:
      type: object
      properties:
        date:
          type: string
          format: date
        totalPnl:
          type: number
        tradeCount:
          type: integer
        winCount:
          type: integer
        lossCount:
          type: integer
      required:
        - date
        - totalPnl
        - tradeCount
        - winCount
        - lossCount
    AnalyzeChartsBody:
      type: object
      properties:
        images:
          type: array
          items:
            type: object
            properties:
              timeframe:
                type: string
              base64:
                type: string
              mediaType:
                type: string
            required:
              - timeframe
              - base64
              - mediaType
        symbol:
          type: string
        currentPrice:
          type: number
        balance:
          type: number
        dailyGoal:
          type: number
      required:
        - images
        - symbol
        - currentPrice
    AnalysisResult:
      type: object
      properties:
        signal:
          type: string
        direction:
          type: string
        entryPrice:
          type: number
        stopLoss:
          type: number
        takeProfit:
          type: number
        leverage:
          type: number
        size:
          type: number
        riskPercent:
          type: number
        liquidationDistance:
          type: number
        syncError:
          type: boolean
        warning:
          type: string
        verdict:
          type: string
        trendAnalysis:
          type: string
        rsiLevel:
          type: number
        emaAlignment:
          type: string
        candlePattern:
          type: string
        timeframes:
          type: array
          items:
            type: object
            properties:
              timeframe:
                type: string
              trend:
                type: string
              price:
                type: number
              rsi:
                type: number
              ema9:
                type: number
              ema21:
                type: number
              pattern:
                type: string
            required:
              - timeframe
              - trend
      required:
        - signal
        - direction
        - verdict

kind = "web"
previewPath = "/"
title = "TradeSniper AI PRO"
version = "1.0.0"
id = "artifacts/tradesniper"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 5000

[services.development]
run = "pnpm --filter @workspace/tradesniper run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tradesniper", "run", "build" ]
publicDir = "artifacts/tradesniper/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "5000"
BASE_PATH = "/"
